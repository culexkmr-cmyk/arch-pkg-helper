[package]
name = "apkg"
version = "1.1.0"
edition = "2021"
description = "Helper/front-end for Arch Linux packages: pacman, AUR, git and script sources in one CLI (vibecoded)"
license = "AGPL-3.0-only"
repository = "https://github.com/culexkmr-cmyk/arch-pkg-helper"
readme = "README.md"
keywords = ["arch", "pacman", "aur", "cli"]

[[bin]]
name = "apkg"
path = "src/main.rs"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[dependencies]
