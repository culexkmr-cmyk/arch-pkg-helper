[package]
name = "pkg"
version = "1.0.0"
edition = "2021"
description = "Helper/front-end for Arch Linux packages: pacman, AUR, git and script sources in one CLI (vibecoded)"
license = "MIT"

[[bin]]
name = "pkg"
path = "src/main.rs"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[dependencies]
